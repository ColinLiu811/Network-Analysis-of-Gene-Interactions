[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-analysis-gene-interactions"
version = "1.1.0"
description = "Protein-protein interaction network analysis pipeline and visualization toolkit."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
  { name = "Colin Liu" }
]
dependencies = [
  "pandas>=1.5.0",
  "networkx>=3.0",
  "matplotlib>=3.5.0",
  "numpy>=1.21.0",
  "pyvis>=0.3.0",
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "tqdm>=4.65.0",
  "psutil>=5.9.0",
  "scipy>=1.9.0",
  "PyYAML>=6.0"
]

[project.urls]
Homepage = "https://github.com/ColinLiu811/Network-Analysis-of-Gene-Interactions"
Repository = "https://github.com/ColinLiu811/Network-Analysis-of-Gene-Interactions"

[project.scripts]
network-analysis = "run_pipeline:main"
network-visualize = "visualize_network:main"
network-visualize-advanced = "visualize_network_advanced:main"

[tool.setuptools]
py-modules = [
  "download_string_data",
  "clean_data",
  "build_graph",
  "compute_centrality",
  "visualize_network",
  "visualize_network_advanced",
  "run_pipeline",
  "pipeline_config",
  "advanced_analysis",
  "benchmark",
  "build_graph_optimized",
  "clean_data_optimized",
  "compute_centrality_optimized",
  "performance_utils",
  "data_processor",
  "gene_network_analysis",
  "network_analyzer",
  "network_visualizer",
  "report_generator",
  "generate_example_data",
  "view_html"
]
