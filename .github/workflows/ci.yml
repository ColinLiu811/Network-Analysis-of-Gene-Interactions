name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
    - name: Verify package entry points
      run: |
        network-analysis --version
        network-visualize --version
    - name: Test data processing
      run: |
        python -c "import pandas as pd; import networkx as nx; print('Dependencies OK')"
    - name: Test script imports
      run: |
        python -c "import download_string_data; import clean_data; import build_graph; import compute_centrality; import visualize_network; import run_pipeline; print('All modules import successfully')"
    - name: Run tests
      run: |
        pytest tests/ -q

  build-package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Build distribution artifacts
      run: |
        python -m pip install --upgrade pip
        pip install build
        python -m build
    - name: Upload package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-dist
        path: dist/

  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker image
      run: |
        docker build -t network-analysis-gene-interactions:ci .

